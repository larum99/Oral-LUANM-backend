spring:
  datasource:
    url: jdbc:h2:mem:clinic_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  sql:
    init:
      mode: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  security:
    public-docs-enabled: true
    jwt:
      secret: test-secret-for-jwt-authentication-32-chars
      expiration-minutes: 480
  cors:
    allowed-origins: http://localhost:5500,http://127.0.0.1:5500